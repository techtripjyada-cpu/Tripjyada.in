name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files to Hostinger via SFTP
        uses: Dylan700/sftp-upload-deploy@latest
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          folders: |
            ./ => /home/u584560477/domains/tripjyada.in/public_html/
          ignore: |
            .git/
            .github/
            node_modules/
            scripts/
            .env
            .env.example
            application/logs/
            application/cache/
            assets/uploads/
            package.json
            package-lock.json
            purgecss.config.js
            purge.mjs
